name: MyTVBox
options:
  bundleIdPrefix: com.mytvbox
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "20260606.1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: "5.9"
targets:
  MyTVBox:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MyTVBox
        excludes:
          - "Info.plist"
          - "MyTVBox-Bridging-Header.h"
    resources:
      - MyTVBox/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: MyTVBox/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.mytvbox.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        DEVELOPMENT_TEAM: ""
        SWIFT_OBJC_BRIDGING_HEADER: "MyTVBox/MyTVBox-Bridging-Header.h"
    info:
      path: MyTVBox/Info.plist
      properties:
        CFBundleDisplayName: MyTVBox
        CFBundleIdentifier: com.mytvbox.app
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "20260606.1"
        MinimumOSVersion: "16.0"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
